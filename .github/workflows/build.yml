name: Build

on:
  push:
    branches: [ main ]
  pull_request:
  # quando você publica uma release pelo site do GitHub (com qualquer nome de tag, com ou sem "v")
  release:
    types: [ published ]
  # rodar na mão: dá para anexar o .exe numa release que já existe
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag de uma release existente para anexar o .exe (ex.: 0.4.0). Vazio = só gerar o .exe.'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Testes (matemática do Raw Accel, conversão, Teste de Perfil, chat, segurança)
        run: dotnet test tests/HarleAccel.Tests/HarleAccel.Tests.csproj -c Release

  build:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publicar HarleAccel.exe
        run: dotnet publish src/HarleAccel/HarleAccel.csproj -c Release -o out

      - uses: actions/upload-artifact@v4
        with:
          name: HarleAccel
          path: out/HarleAccel.exe

      - name: Anexar o .exe na release
        if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.tag != '')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.event.release.tag_name }}
          files: out/HarleAccel.exe
