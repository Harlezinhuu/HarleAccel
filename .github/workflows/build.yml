name: Build

on:
  push:
    branches: [ main ]
    # enviar uma tag (ex.: 0.4.1) cria a release com o .exe
    tags: [ '*' ]
  pull_request:
  # quando você publica uma release pelo site do GitHub (com qualquer nome de tag, com ou sem "v")
  release:
    types: [ published ]
  # rodar na mão: dá para anexar o .exe numa release que já existe
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag de uma release existente para anexar o .exe (ex.: 0.4.0). Vazio = só gerar o .exe.'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Testes (matemática do Raw Accel, conversão, Teste de Perfil, chat, segurança)
        run: dotnet test tests/HarleAccel.Tests/HarleAccel.Tests.csproj -c Release

  build:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publicar HarleAccel.exe
        run: dotnet publish src/HarleAccel/HarleAccel.csproj -c Release -o out

      - uses: actions/upload-artifact@v4
        with:
          name: HarleAccel
          path: out/HarleAccel.exe

      - name: Ver se é uma versão (tag) e se tem notas em docs/releases
        id: rel
        shell: bash
        run: |
          TAG="${{ inputs.tag || github.event.release.tag_name }}"
          if [ -z "$TAG" ] && [ "${{ github.ref_type }}" = "tag" ]; then TAG="${{ github.ref_name }}"; fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          if [ -n "$TAG" ] && [ -f "docs/releases/$TAG.md" ]; then echo "notes=docs/releases/$TAG.md" >> "$GITHUB_OUTPUT"; fi

      - name: Criar a release (ou anexar o .exe numa que já existe)
        if: steps.rel.outputs.tag != ''
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.rel.outputs.tag }}
          name: HarleAccel ${{ steps.rel.outputs.tag }}
          body_path: ${{ steps.rel.outputs.notes }}
          files: out/HarleAccel.exe
