name: Build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Testes (matemática do Raw Accel, conversão, Teste de Perfil, chat)
        run: dotnet test tests/HarleAccel.Tests/HarleAccel.Tests.csproj -c Release

  build:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publicar HarleAccel.exe
        run: dotnet publish src/HarleAccel/HarleAccel.csproj -c Release -o out

      - uses: actions/upload-artifact@v4
        with:
          name: HarleAccel
          path: out/HarleAccel.exe

      - name: Criar release (quando a tag começa com v)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/HarleAccel.exe
          generate_release_notes: true
